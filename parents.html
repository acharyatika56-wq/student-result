<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>विद्यार्थी दैनिक गतिविधि परिणाम</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;padding:12px}
    .header{background:#1e3a8a;color:white;padding:16px;border-radius:10px;text-align:center;margin-bottom:15px}
    .card{background:white;border-radius:10px;padding:12px;box-shadow:0 2px 8px #0001;margin-bottom:15px}
    table{border-collapse:collapse;width:100%;min-width:600px}
    th,td{border:1px solid #e2e8f0;padding:8px;text-align:center;font-size:14px}
    th{background:#3b82f6;color:white}
    .green{color:#16a34a;font-weight:bold}
    .red{color:#dc2626;font-weight:bold}
    .score{font-weight:bold;background:#f1f5f9}
    .top{color:#16a34a}
    .low{color:#dc2626}
    input{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px;font-size:14px}
  </style>
</head>
<body>

<div class="header">
  <h2 style="margin:0" id="title">📊 दैनिक गतिविधि परिणाम Portal</h2>
  <div id="subTitle" style="font-size:14px;margin-top:5px">डाटा लोड हुँदैछ...</div>
</div>

<div class="card">
  <label><b>विद्यार्थीको नाम वा सेक्सन खोज्नुहोस्:</b></label>
  <input id="search" placeholder="विद्यार्थीको नाम वा सेक्सन लेख्नुहोस्..." oninput="render()">
</div>

<div class="card" style="overflow:auto">
  <table id="tbl">
    <tr><td style="padding:20px;">डाटा तान्दैछ, कृपया १ छिन पर्खिनुहोस्...</td></tr>
  </table>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyE6tTd6V0NyIw_-brrjhwgeP0vFBDBSwWbofx-ttw1m8_8t15DSUZP6VxALFcmbhvVvQ/exec";

let P_DATA = null;

function loadData() {
  fetch(API_URL)
    .then(res => res.text())
    .then(textData => {
      try {
        let parsed = typeof textData === 'string' ? JSON.parse(textData) : textData;
        if (typeof parsed === 'string') parsed = JSON.parse(parsed);

        if (!parsed || !parsed.data || !parsed.data.students || parsed.data.students.length === 0) {
          document.getElementById('subTitle').textContent = "अझै नतिजा Publish भएको छैन।";
          document.getElementById('tbl').innerHTML = '<tr><td style="padding:20px;color:#c62828;">कुनै डाटा भेटिएन। पहिले Teacher Dashboard बाट Publish गर्नुहोस्।</td></tr>';
          return;
        }

        P_DATA = parsed;
        document.getElementById('title').textContent = `📊 कक्षा ${P_DATA.className || ''} — ${P_DATA.subject || ''}`;
        document.getElementById('subTitle').textContent = `अन्तिम अद्यावधिक परिणाम`;
        render();
      } catch (e) {
        document.getElementById('subTitle').textContent = "डाटा Format मा समस्या आयो।";
        document.getElementById('tbl').innerHTML = '<tr><td style="padding:20px;color:#c62828;">डाटा पढ्न सकिएन। कृपया Teacher Panel बाट पुनः Publish गर्नुहोस्।</td></tr>';
      }
    })
    .catch(err => {
      document.getElementById('subTitle').textContent = "डाटा लोड गर्न सकिएन।";
      document.getElementById('tbl').innerHTML = '<tr><td style="padding:20px;color:#c62828;">कनेक्सन भएन। नेटवर्क वा Apps Script URL जाँच्नुहोस्।</td></tr>';
    });
}

function score(s) {
  let z = 0;
  Object.values(s.m || {}).forEach(a => Object.values(a).forEach(v => z += v == 1 ? 5 : v == -1 ? -2.5 : 0));
  return z;
}

function render() {
  if (!P_DATA || !P_DATA.data) return;
  let D = P_DATA.data;
  let query = document.getElementById('search').value.toLowerCase().trim();

  let filtered = (D.students || []).filter(s =>
    s.name.toLowerCase().includes(query) ||
    (s.sec && s.sec.toLowerCase().includes(query))
  );

  if (filtered.length === 0) {
    document.getElementById('tbl').innerHTML = '<tr><td style="padding:20px;">यो नाम/सेक्सनको विद्यार्थी भेटिएन।</td></tr>';
    return;
  }

  let h = '<tr><th>क्र.सं.</th><th>विद्यार्थीको नाम</th><th>सेक्सन</th>';
  (D.days || []).forEach(d => h += `<th colspan="3">${d}<br><small>HW | CW | DIS</small></th>`);
  h += '<th>कुल अंक</th></tr>';

  filtered.forEach((s, i) => {
    let sc = score(s);
    h += `<tr><td>${i + 1}</td><td style="text-align:left;font-weight:bold">${s.name}</td><td>${s.sec || '-'}</td>`;
    (D.days || []).forEach(d => {
      let a = (s.m && s.m[d]) ? s.m[d] : {};
      ['hw', 'cw', 'dis'].forEach(k => {
        let v = a[k] || 0;
        h += `<td class="${v == 1 ? 'green' : v == -1 ? 'red' : ''}">${v == 1 ? '✓' : v == -1 ? '✕' : '—'}</td>`;
      });
    });
    h += `<td class="score ${sc >= 40 ? 'top' : sc < 25 ? 'low' : ''}">${sc}</td></tr>`;
  });

  document.getElementById('tbl').innerHTML = h;
}

loadData();
</script>
</body>
</html>
