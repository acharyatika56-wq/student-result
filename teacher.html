<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Entry Panel - Fixed</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --accent: #3b82f6;
      --bg: #edf2f7;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --border-color: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 12px;
    }

    .app-header {
      background: linear-gradient(135deg, #1e3a8a, #3b82f6);
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .app-title { margin: 0; font-size: 20px; font-weight: 800; }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      width: 100%;
    }

    .rule-info-box {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .rule-item { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
    .rule-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%; color: white; font-weight: 800; font-size: 11px;
    }
    .bg-green { background: var(--success); }
    .bg-red { background: var(--danger); }
    .bg-gray { background: #64748b; }

    .filter-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .grid-top {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      align-items: end;
    }
    .grid-btns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 12px;
      border-top: 1px dashed #cbd5e1;
      padding-top: 12px;
    }

    label { font-weight: 700; font-size: 11px; color: #334155; display: block; margin-bottom: 4px; text-transform: uppercase; }
    select, input {
      width: 100%; padding: 6px 8px; border: 1.5px solid #cbd5e1; border-radius: 7px; font-size: 12px; outline: none; background: #f8fafc;
    }
    select:focus, input:focus { border-color: var(--accent); background: #ffffff; }

    .bs-date-container { display: flex; gap: 3px; }
    .bs-date-container select { padding: 6px 3px; font-size: 11px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; border: none;
    }
    .btn-add { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; }
    .btn-pub { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; }
    .btn-pdf { background: linear-gradient(135deg, #ea580c, #c2410c); color: white; }
    
    .btn-action {
      background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 5px; cursor: pointer; font-size: 10px; padding: 2px 4px; margin-left: 2px;
    }
    .btn-del-date {
      display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%;
      background: rgba(239, 68, 68, 0.2); color: #f87171; border: none; cursor: pointer; margin-left: 4px; font-size: 10px; font-weight: bold;
    }
    .btn-del-date:hover { background: #ef4444; color: #ffffff; }

    .table-container { width: 100%; overflow-x: auto; border-radius: 8px; border: 1px solid var(--border-color); }
    table { border-collapse: collapse; width: 100%; background: white; }
    th, td { border: 1px solid var(--border-color); padding: 4px 2px; text-align: center; font-size: 11px; }
    
    thead th { background: var(--primary-dark); color: white; font-weight: 700; padding: 6px 2px; }
    .sub-th { background: #2563eb !important; font-size: 10px; cursor: pointer; }
    .score-th { background: #0f766e !important; font-size: 10px; }
    .grand-total-th { background: #047857 !important; font-size: 11px; color: white; }
    
    .student-name-td { text-align: left; padding: 4px 6px; font-weight: 700; font-size: 11px; border-right: 2px solid var(--border-color); background: #fff; }

    .cell { font-size: 12px; cursor: pointer; font-weight: 800; }
    .mark-icon { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; font-size: 11px; font-weight: 900; }
    .icon-tick { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .icon-cross { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .icon-dash { color: #94a3b8; }

    .score-cell { background: #f0f9ff; font-weight: 800; color: #0284c7; }
    .grand-total-cell { background: #d1fae5; font-weight: 900; color: #065f46; border-left: 2px solid #10b981; }
    .sec-tag { font-size: 9px; color: #64748b; margin-left: 2px; }

    #loadingStatus { text-align: center; padding: 8px; font-weight: bold; color: #0284c7; background: #e0f2fe; border-radius: 8px; margin-bottom: 10px; display: none; font-size: 12px; }
  </style>
</head>
<body>

<div class="app-header">
  <h3 class="app-title">👨‍🏫 Teacher Entry Panel (Fixed)</h3>
  <div style="font-size: 12px; opacity: 0.9;">विषयअनुसार छुट्टै मिति व्यवस्थापन</div>
</div>

<div id="loadingStatus">सर्भरबाट डाटा लोड हुँदैछ...</div>

<div class="rule-info-box">
  <span style="font-weight:bold;">📌 अंक नियम:</span>
  <div class="rule-item"><span class="rule-badge bg-green">✓</span><span>+५</span></div>
  <div class="rule-item"><span class="rule-badge bg-red">✕</span><span>-२.५</span></div>
  <div class="rule-item"><span class="rule-badge bg-gray">—</span><span>०</span></div>
</div>

<div class="filter-box">
  <div class="grid-top">
    <div>
      <label>कक्षा (Class):</label>
      <select id="classFilter" onchange="fetchServerData()">
        <option value="8">Class 8</option>
        <option value="9" selected>Class 9</option>
        <option value="10">Class 10</option>
      </select>
    </div>
    <div>
      <label>सेक्सन (Section):</label>
      <select id="sectionFilter" onchange="renderDashboard()">
        <option value="ALL">सबै (All)</option>
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div>
      <label>विषय (Subject):</label>
      <select id="subject" onchange="fetchServerData()">
        <option value="Math">Math</option>
        <option value="Science">Science</option>
        <option value="Nepali">Nepali</option>
        <option value="English">English</option>
        <option value="Social Studies">Social Studies</option>
        <option value="Opt.Math">Opt.Math</option>
        <option value="Computer Science">Computer Science</option>
      </select>
    </div>
    
    <div>
      <label>मिति फिल्टर (Range):</label>
      <select id="dateRangeFilter" onchange="renderDashboard()">
        <option value="ALL">सबै मितिहरू (All)</option>
        <option value="1DAY">आजको मिति (1 Day)</option>
        <option value="1WEEK">पछिल्लो १ हप्ता (1 Week)</option>
        <option value="1MONTH">पछिल्लो १ महिना (1 Month)</option>
      </select>
    </div>

    <div>
      <label>विशिष्ट मिति (Date):</label>
      <select id="singleDateFilter" onchange="renderDashboard()">
        <option value="ALL">सबै (All)</option>
      </select>
    </div>

    <div>
      <label>नेपाली मिति थप्नुहोस् (BS):</label>
      <div class="bs-date-container">
        <select id="bsYear"></select>
        <select id="bsMonth"></select>
        <select id="bsDay"></select>
      </div>
    </div>

    <div>
      <button class="btn btn-add" onclick="addNewDay()">➕ मिति थप्नुहोस्</button>
    </div>
  </div>

  <div class="grid-btns">
    <div><button class="btn btn-pub" onclick="publishData()">🌐 Publish</button></div>
    <div><button class="btn btn-pdf" onclick="exportToPDF()">📄 Download PDF</button></div>
  </div>

  <div class="grid-top" style="margin-top:12px; border-top:1px dashed #cbd5e1; padding-top:12px;">
    <div style="grid-column: span 2;">
      <label>नयाँ विद्यार्थी:</label>
      <input type="text" id="newStudentName" placeholder="विद्यार्थीको नाम...">
    </div>
    <div>
      <label>सेक्सन:</label>
      <select id="newStudentSec">
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div>
      <button class="btn btn-add" onclick="addNewStudent()">👤 विद्यार्थी थप्नुहोस्</button>
    </div>
  </div>
</div>

<div class="card">
  <div id="infoBanner" style="font-weight:700; margin-bottom:8px; font-size:13px; color: var(--primary-dark);"></div>
  <div class="table-container">
    <table id="tbl"></table>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxATLaWfOE7XdJT7A3N9GXYLMkokyXworxNMO7vVkS9vl4RB7NJOPUrZXijZk3ecwDq-A/exec";
let currentData = { students: [], days: [] };
let globalMasterStudents = []; 

const nepaliMonths = ["वैशाख", "जेठ", "असार", "साउन", "भदौ", "असोज", "कार्तिक", "मंसिर", "पुस", "माघ", "फागुन", "चैत"];

function toNpNum(str) {
  if (str === undefined || str === null) return '';
  const np = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
  return str.toString().replace(/[0-9]/g, w => np[parseInt(w)]);
}

function initNepaliDateDropdowns() {
  let yearSel = document.getElementById('bsYear');
  let monthSel = document.getElementById('bsMonth');
  let daySel = document.getElementById('bsDay');

  yearSel.innerHTML = ''; monthSel.innerHTML = ''; daySel.innerHTML = '';

  for (let y = 2081; y <= 2085; y++) {
    let opt = document.createElement('option');
    opt.value = y; opt.textContent = toNpNum(y);
    if (y === 2083) opt.selected = true;
    yearSel.appendChild(opt);
  }

  nepaliMonths.forEach((m, idx) => {
    let opt = document.createElement('option');
    opt.value = String(idx + 1).padStart(2, '0');
    opt.textContent = m;
    monthSel.appendChild(opt);
  });

  for (let d = 1; d <= 32; d++) {
    let opt = document.createElement('option');
    let val = String(d).padStart(2, '0');
    opt.value = val; opt.textContent = toNpNum(d);
    daySel.appendChild(opt);
  }
}

function updateDateFilterDropdown() {
  let singleDateFilter = document.getElementById('singleDateFilter');
  let currentVal = singleDateFilter.value;
  singleDateFilter.innerHTML = '<option value="ALL">सबै (All)</option>';
  
  let days = currentData.days || [];
  days.forEach(d => {
    let opt = document.createElement('option');
    opt.value = d;
    opt.textContent = toNpNum(d);
    singleDateFilter.appendChild(opt);
  });

  if (days.includes(currentVal)) {
    singleDateFilter.value = currentVal;
  } else {
    singleDateFilter.value = "ALL";
  }
}

function syncStudentsWithMaster(fetchedData) {
  let fetchedStudents = fetchedData.students || [];
  
  if (fetchedStudents.length > 0) {
    fetchedStudents.forEach(fSt => {
      let exists = globalMasterStudents.find(mSt => mSt.id == fSt.id || mSt.name.trim().toLowerCase() === fSt.name.trim().toLowerCase());
      if (!exists) {
        globalMasterStudents.push({ id: fSt.id, name: fSt.name, sec: fSt.sec });
      }
    });
  }

  let mergedStudents = globalMasterStudents.map(mSt => {
    let found = fetchedStudents.find(fSt => fSt.id == mSt.id || fSt.name.trim().toLowerCase() === mSt.name.trim().toLowerCase());
    if (found) {
      return found;
    } else {
      return { id: mSt.id, name: mSt.name, sec: mSt.sec, m: {} };
    }
  });

  // Deep copy गर्नुपर्छ ताकि विषय फेर्दा डाटा आपसमा मिक्स नहोस्
  return JSON.parse(JSON.stringify({
    students: mergedStudents,
    days: fetchedData.days || []
  }));
}

function fetchServerData() {
  let selectedClass = document.getElementById('classFilter').value;
  let sub = document.getElementById('subject').value;
  let statusBox = document.getElementById('loadingStatus');
  statusBox.style.display = "block";

  fetch(`${API_URL}?className=${selectedClass}&subject=${sub}`)
    .then(res => res.json())
    .then(data => {
      statusBox.style.display = "none";
      currentData = syncStudentsWithMaster(data || { students: [], days: [] });
      updateDateFilterDropdown();
      renderDashboard();
    })
    .catch(err => {
      statusBox.style.display = "none";
      currentData = syncStudentsWithMaster({ students: [], days: [] });
      updateDateFilterDropdown();
      renderDashboard();
    });
}

function getFilteredDays() {
  let days = currentData.days || [];
  let rangeFilter = document.getElementById('dateRangeFilter').value;
  let singleDate = document.getElementById('singleDateFilter').value;

  if (singleDate !== "ALL") {
    return days.filter(d => d === singleDate);
  }

  if (rangeFilter === "1DAY") return days.slice(0, 1);
  if (rangeFilter === "1WEEK") return days.slice(0, 7);
  if (rangeFilter === "1MONTH") return days.slice(0, 30);

  return days;
}

function renderDashboard() {
  let selectedClass = document.getElementById('classFilter').value;
  let sub = document.getElementById('subject').value;
  let targetSec = document.getElementById('sectionFilter').value;
  
  document.getElementById('infoBanner').textContent = `📋 कक्षा: ${toNpNum(selectedClass)} | सेक्सन: ${targetSec} | विषय: ${sub}`;

  let students = currentData.students || [];
  let days = currentData.days || [];
  let displayDays = getFilteredDays();

  let filteredStudents = students.filter(s => {
    if (targetSec === "ALL") return true;
    return (s.sec || "Darwin").toString().toLowerCase() === targetSec.toLowerCase();
  });

  filteredStudents.sort((a, b) => a.name.localeCompare(b.name, 'ne'));

  let h = '<thead><tr><th rowspan="2">विद्यार्थीको नाम</th>';
  displayDays.forEach(d => {
    h += `<th colspan="4">${toNpNum(d)} <button class="btn-del-date" onclick="deleteDate('${d}')" title="हटाउनुहोस्">✕</button></th>`;
  });
  h += '<th rowspan="2" class="grand-total-th">जम्मा अंक<br>(Total)</th></tr><tr>';
  
  displayDays.forEach(d => {
    h += `<th class="sub-th" onclick="bulkToggleDate('${d}', 'hw')">HW</th>`;
    h += `<th class="sub-th" onclick="bulkToggleDate('${d}', 'cw')">CW</th>`;
    h += `<th class="sub-th" onclick="bulkToggleDate('${d}', 'dis')">DIS</th>`;
    h += `<th class="score-th">अंक</th>`;
  });
  h += '</tr></thead><tbody>';

  if (filteredStudents.length === 0) {
    h += `<tr><td colspan="50" style="padding:15px; color:#dc2626; font-weight: bold;">कुनै विवरण भेटिएन।</td></tr>`;
  } else {
    filteredStudents.forEach((student) => {
      let stId = student.id;
      h += `<tr>
        <td class="student-name-td">
          ${student.name}<span class="sec-tag">(${student.sec || 'Darwin'})</span>
          <button class="btn-action" onclick="editStudentDetails(${stId})">✏️</button>
          <button class="btn-action" onclick="deleteStudent(${stId})">🗑️</button>
        </td>`;
        
      let mData = student.m || {};
      let grandTotalScore = 0;

      days.forEach(d => {
        let rawDayData = mData[d] || {};
        let dayScore = (rawDayData.hw === 1 ? 5 : (rawDayData.hw === -1 ? -2.5 : 0)) +
                       (rawDayData.cw === 1 ? 5 : (rawDayData.cw === -1 ? -2.5 : 0)) +
                       (rawDayData.dis === 1 ? 5 : (rawDayData.dis === -1 ? -2.5 : 0));
        grandTotalScore += dayScore;
      });

      displayDays.forEach(d => {
        let rawDayData = mData[d] || {};
        let dayData = {
          hw: rawDayData.hw !== undefined ? rawDayData.hw : 0,
          cw: rawDayData.cw !== undefined ? rawDayData.cw : 0,
          dis: rawDayData.dis !== undefined ? rawDayData.dis : 0
        };

        let dayScore = (dayData.hw === 1 ? 5 : (dayData.hw === -1 ? -2.5 : 0)) +
                       (dayData.cw === 1 ? 5 : (dayData.cw === -1 ? -2.5 : 0)) +
                       (dayData.dis === 1 ? 5 : (dayData.dis === -1 ? -2.5 : 0));

        h += `<td class="cell" onclick="toggleMark(${stId}, '${d}', 'hw')">${getFormattedBadge(dayData.hw)}</td>`;
        h += `<td class="cell" onclick="toggleMark(${stId}, '${d}', 'cw')">${getFormattedBadge(dayData.cw)}</td>`;
        h += `<td class="cell" onclick="toggleMark(${stId}, '${d}', 'dis')">${getFormattedBadge(dayData.dis)}</td>`;
        h += `<td class="score-cell">${toNpNum(dayScore)}</td>`;
      });

      h += `<td class="grand-total-cell">${toNpNum(grandTotalScore)}</td>`;
      h += `</tr>`;
    });
  }

  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
}

function getFormattedBadge(v) {
  if (v === 1) return `<span class="mark-icon icon-tick">✓</span>`;
  if (v === -1) return `<span class="mark-icon icon-cross">✕</span>`;
  return `<span class="icon-dash">—</span>`;
}

function toggleMark(stId, dateStr, type) {
  let st = currentData.students.find(s => s.id == stId);
  if (!st) return;
  if (!st.m) st.m = {};
  if (!st.m[dateStr]) st.m[dateStr] = { hw: 0, cw: 0, dis: 0 };

  let val = st.m[dateStr][type] || 0;
  st.m[dateStr][type] = val === 0 ? 1 : (val === 1 ? -1 : 0);
  renderDashboard();
}

function bulkToggleDate(dateStr, type) {
  let targetSec = document.getElementById('sectionFilter').value;
  let filtered = currentData.students.filter(s => {
    if (targetSec === "ALL") return true;
    return (s.sec || "Darwin").toString().toLowerCase() === targetSec.toLowerCase();
  });

  if(filtered.length === 0) return;

  let allTicked = filtered.every(st => st.m && st.m[dateStr] && st.m[dateStr][type] === 1);
  let nextVal = allTicked ? 0 : 1;

  filtered.forEach(st => {
    if (!st.m) st.m = {};
    if (!st.m[dateStr]) st.m[dateStr] = { hw: 0, cw: 0, dis: 0 };
    st.m[dateStr][type] = nextVal;
  });

  renderDashboard();
}

function editStudentDetails(studentId) {
  let st = currentData.students.find(s => s.id == studentId);
  if (!st) return;
  
  let newName = prompt("विद्यार्थीको नयाँ नाम लेख्नुहोस्:", st.name);
  if (newName !== null && newName.trim() !== "") {
    st.name = newName.trim();
    let masterSt = globalMasterStudents.find(m => m.id == studentId);
    if (masterSt) masterSt.name = st.name;

    let newSec = prompt(`"${st.name}" को सेक्सन फेर्नुहोस् (Darwin/Newton):`, st.sec || "Darwin");
    if (newSec !== null && newSec.trim() !== "") {
      st.sec = newSec.trim();
      if (masterSt) masterSt.sec = st.sec;
    }
    renderDashboard();
  }
}

function deleteStudent(studentId) {
  let st = currentData.students.find(s => s.id == studentId);
  if (!st) return;
  if (confirm(`के तपाईं "${st.name}" लाई हटाउन चाहनुहुन्छ?`)) {
    currentData.students = currentData.students.filter(s => s.id != studentId);
    globalMasterStudents = globalMasterStudents.filter(s => s.id != studentId);
    renderDashboard();
  }
}

function deleteDate(dateStr) {
  if (confirm(`के तपाईं मिति "${toNpNum(dateStr)}" लाई हटाउन चाहनुहुन्छ?`)) {
    currentData.days = currentData.days.filter(d => d !== dateStr);
    updateDateFilterDropdown();
    renderDashboard();
  }
}

function addNewDay() {
  let y = document.getElementById('bsYear').value;
  let m = document.getElementById('bsMonth').value;
  let d = document.getElementById('bsDay').value;
  let dateStr = `${y}-${m}-${d}`;
  
  if (!currentData.days.includes(dateStr)) {
    currentData.days.unshift(dateStr);
    (currentData.students || []).forEach(st => {
      if (!st.m) st.m = {};
      st.m[dateStr] = { hw: 0, cw: 0, dis: 0 };
    });
    updateDateFilterDropdown();
    renderDashboard();
  } else {
    alert("यो मिति पहिले नै थपिइसकेको छ!");
  }
}

function addNewStudent() {
  let name = document.getElementById('newStudentName').value.trim();
  let sec = document.getElementById('newStudentSec').value;
  if (!name) return alert("नाम लेख्नुहोस्!");

  let emptyMarks = {};
  (currentData.days || []).forEach(d => {
    emptyMarks[d] = { hw: 0, cw: 0, dis: 0 };
  });

  let newStObj = { id: Date.now(), name: name, sec: sec, m: emptyMarks };
  currentData.students.push(newStObj);
  globalMasterStudents.push({ id: newStObj.id, name: name, sec: sec });

  document.getElementById('newStudentName').value = "";
  renderDashboard();
}

function publishData() {
  let selectedClass = document.getElementById('classFilter').value;
  let sub = document.getElementById('subject').value;
  let statusBox = document.getElementById('loadingStatus');
  statusBox.style.display = "block";

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ className: selectedClass, subject: sub, data: currentData })
  })
  .then(res => res.json())
  .then(() => {
    statusBox.style.display = "none";
    alert("डाटा सफलतापूर्वक Publish भयो!");
  })
  .catch(() => {
    statusBox.style.display = "none";
    alert("डाटा Publish भयो!");
  });
}

function exportToPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

  let selectedClass = document.getElementById('classFilter').value;
  let sub = document.getElementById('subject').value;
  let targetSec = document.getElementById('sectionFilter').value;

  doc.setFontSize(16);
  doc.text(`Student Performance Report`, 14, 15);
  doc.setFontSize(10);
  doc.text(`Class: ${selectedClass} | Section: ${targetSec} | Subject: ${sub}`, 14, 22);

  let days = currentData.days || [];
  let displayDays = getFilteredDays();
  let students = currentData.students || [];

  let filteredStudents = students.filter(s => {
    if (targetSec === "ALL") return true;
    return (s.sec || "Darwin").toString().toLowerCase() === targetSec.toLowerCase();
  });

  filteredStudents.sort((a, b) => a.name.localeCompare(b.name, 'ne'));

  let headRows1 = [{ content: 'Student Name', rowSpan: 2 }];
  let headRows2 = [];

  displayDays.forEach(d => {
    headRows1.push({ content: d, colSpan: 4, styles: { halign: 'center' } });
    headRows2.push('HW', 'CW', 'DIS', 'Score');
  });

  headRows1.push({ content: 'Total Score', rowSpan: 2, styles: { halign: 'center', fillColor: [4, 120, 87] } });

  let bodyRows = [];
  filteredStudents.forEach(st => {
    let row = [`${st.name} (${st.sec || 'Darwin'})`];
    let mData = st.m || {};
    let total = 0;

    days.forEach(d => {
      let dayData = mData[d] || { hw: 0, cw: 0, dis: 0 };
      let score = (dayData.hw === 1 ? 5 : (dayData.hw === -1 ? -2.5 : 0)) +
                  (dayData.cw === 1 ? 5 : (dayData.cw === -1 ? -2.5 : 0)) +
                  (dayData.dis === 1 ? 5 : (dayData.dis === -1 ? -2.5 : 0));
      total += score;
    });

    displayDays.forEach(d => {
      let dayData = mData[d] || { hw: 0, cw: 0, dis: 0 };
      let score = (dayData.hw === 1 ? 5 : (dayData.hw === -1 ? -2.5 : 0)) +
                  (dayData.cw === 1 ? 5 : (dayData.cw === -1 ? -2.5 : 0)) +
                  (dayData.dis === 1 ? 5 : (dayData.dis === -1 ? -2.5 : 0));

      row.push(
        dayData.hw === 1 ? 'P' : (dayData.hw === -1 ? 'X' : '-'),
        dayData.cw === 1 ? 'P' : (dayData.cw === -1 ? 'X' : '-'),
        dayData.dis === 1 ? 'P' : (dayData.dis === -1 ? 'X' : '-'),
        score
      );
    });

    row.push(total);
    bodyRows.push(row);
  });

  doc.autoTable({
    startY: 28,
    head: [headRows1, headRows2],
    body: bodyRows,
    theme: 'grid',
    styles: { fontSize: 8, cellPadding: 2, halign: 'center' },
    headStyles: { fillColor: [30, 58, 138], textColor: 255, fontStyle: 'bold' },
    columnStyles: { 0: { halign: 'left', fontStyle: 'bold' } }
  });

  doc.save(`Class_${selectedClass}_${sub}_Report.pdf`);
}

window.onload = function() {
  initNepaliDateDropdowns();
  fetchServerData();
};
