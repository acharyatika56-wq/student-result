<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Entry Panel</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;padding:8px}
    .card{background:white;border-radius:8px;padding:8px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,0.05)}
    .filter-box{background:#e0f2fe;border:1px solid #0284c7;padding:8px;border-radius:8px;margin-bottom:8px}
    
    .rule-info-box{background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
    .rule-item{display:inline-flex;align-items:center;gap:4px;font-weight:bold}
    .rule-badge{display:inline-block;padding:1px 5px;border-radius:3px;color:white;font-weight:bold;font-size:11px}
    .bg-green{background:#16a34a}
    .bg-red{background:#dc2626}
    .bg-gray{background:#64748b}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
    label{font-weight:bold;font-size:11px;display:block;margin-bottom:2px}
    select,input,button{width:100%;padding:5px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px}
    button{background:#1769aa;color:white;font-weight:bold;cursor:pointer;border:none}
    .btn-pub{background:#16a34a;margin-top:6px}
    .btn-add{background:#0284c7;margin-top:6px}
    .btn-edit-sec{background:#eab308;color:#000;font-size:9px;padding:1px 4px;margin-left:4px;border-radius:3px;cursor:pointer}

    table{border-collapse:collapse;width:100%;table-layout:auto;}
    th,td{border:1px solid #cbd5e1;padding:2px 3px;text-align:center;font-size:11px}
    th{background:#173f78;color:white;font-size:11px}
    .sub-th{background:#1e4c8a;font-size:9px;padding:2px;width:22px}
    .score-th{background:#0d5257;font-size:9px;padding:2px;width:28px;color:#fff}
    .cell{font-size:12px;min-width:20px;user-select:none;font-weight:bold;cursor:pointer}
    .green{background:#effaf3;color:green}
    .red{background:#fff1f1;color:red}
    .score-cell{background:#e2f8ff;font-weight:bold;color:#0369a1;font-size:11px}
    
    .student-name-td{text-align:left;padding-left:5px;font-weight:bold;background:#f8fafc;font-size:11px;white-space:nowrap}
    #loadingStatus{text-align:center;padding:8px;font-weight:bold;color:#0284c7;background:#e0f2fe;border-radius:4px;margin-bottom:8px;display:none;font-size:12px}
    .section-title{font-size:13px;font-weight:bold;color:#0369a1;margin-bottom:6px}
  </style>
</head>
<body>

<h3 style="margin:0 0 6px 0;font-size:16px;">👨‍🏫 Teacher Entry Panel</h3>

<div id="loadingStatus">सर्भरबाट डाटा लोड हुँदैछ...</div>

<div class="rule-info-box">
  <span style="font-weight:bold;color:#1e293b;">📌 अंक नियम:</span>
  <div class="rule-item"><span class="rule-badge bg-green">✓</span><span>+५ (गरेको)</span></div>
  <div class="rule-item"><span class="rule-badge bg-red">✕</span><span>-२.५ (नगरेको)</span></div>
  <div class="rule-item"><span class="rule-badge bg-gray">—</span><span>० (खाली)</span></div>
</div>

<div class="filter-box">
  <div class="grid">
    <div>
      <label>कक्षा (Class):</label>
      <select id="classFilter" onchange="fetchServerData()">
        <option value="8">Class 8</option>
        <option value="9" selected>Class 9</option>
        <option value="10">Class 10</option>
      </select>
    </div>
    <div>
      <label>सेक्सन (Section):</label>
      <select id="sectionFilter" onchange="renderDashboard()">
        <option value="ALL">सबै सेक्सन (All)</option>
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div>
      <label>विषय (Subject):</label>
      <select id="subject" onchange="fetchServerData()">
        <option value="Math">Math</option>
        <option value="Science">Science</option>
        <option value="Nepali">Nepali</option>
        <option value="English">English</option>
        <option value="Social Studies">Social Studies</option>
        <option value="Opt.Math">Opt.Math</option>
        <option value="Computer Science">Computer Science</option>
      </select>
    </div>
    <div>
      <label>नयाँ मिति थप्नुहोस्:</label>
      <input type="date" id="newDateInput">
    </div>
    <div style="align-self:end">
      <button class="btn-add" onclick="addNewDay()">+ मिति थप्नुहोस्</button>
    </div>
  </div>

  <div class="grid" style="margin-top:8px; border-top:1px dashed #0284c7; padding-top:8px;">
    <div>
      <label>नयाँ विद्यार्थी नाम:</label>
      <input type="text" id="newStudentName" placeholder="विद्यार्थीको नाम...">
    </div>
    <div>
      <label>सेक्सन छान्नुहोस्:</label>
      <select id="newStudentSec">
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div style="align-self:end">
      <button class="btn-add" onclick="addNewStudent()">+ विद्यार्थी थप्नुहोस्</button>
    </div>
    <div style="align-self:end">
      <button class="btn-pub" onclick="publishData()">🌐 सुरक्षित Publish गर्नुहोस्</button>
    </div>
  </div>
</div>

<div class="card">
  <div id="infoBanner" class="section-title">कक्षा: ९ | सेक्सन: ALL | विषय: Math</div>
  <div style="width:100%;overflow-x:auto;">
    <table id="tbl"></table>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxATLaWfOE7XdJT7A3N9GXYLMkokyXworxNMO7vVkS9vl4RB7NJOPUrZXijZk3ecwDq-A/exec";

let currentData = {
  students: [],
  days: []
};

function toNpNum(str) {
  if (str === undefined || str === null) return '';
  const np = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
  return str.toString().replace(/[0-9]/g, w => np[parseInt(w)]);
}

// मितिलाई अनिवार्य नेपालीमा परिणत गर्ने दरोगो Function
function formatNepaliDate(dStr) {
  if (!dStr) return '';
  let str = dStr.toString().split('T')[0];
  let parts = str.split('-');
  
  if (parts.length === 3) {
    let y = parseInt(parts[0]);
    let m = parseInt(parts[1]);
    let d = parseInt(parts[2]);
    
    // AD मिति हो भने BS मा रुपान्तरण गर्ने सामान्य हिसाब
    if (y > 2000) {
      m = m + 8;
      if (m > 12) m -= 12;
    }
    let months = ["बैशाख","जेठ","असार","साउन","भदौ","असोज","कार्तिक","मंसिर","पुस","माघ","फागुन","चैत"];
    return months[m - 1] + " " + toNpNum(d);
  }
  return toNpNum(dStr);
}

function fetchServerData() {
  let selectedClass = document.getElementById('classFilter').value;
  let sub = document.getElementById('subject').value;
  let statusBox = document.getElementById('loadingStatus');
  statusBox.style.display = "block";

  fetch(`${API_URL}?className=${selectedClass}&subject=${sub}`)
    .then(res => res.json())
    .then(data => {
      statusBox.style.display = "none";
      if (data && (data.students || data.days)) {
        currentData.students = (data.students || []).map((s, idx) => ({
          id: s.id || (Date.now() + idx),
          name: s.name || s.studentName || "Unknown",
          sec: s.sec || s.section || "Darwin",
          m: s.m || s.marks || {}
        }));
        currentData.days = data.days || [];
      } else {
        currentData = { students: [], days: [] };
      }
      renderDashboard();
    })
    .catch(err => {
      console.error(err);
      statusBox.style.display = "none";
      renderDashboard();
    });
}

function renderDashboard() {
  let selectedClass = document.getElementById('classFilter').value;
  let sub = document.getElementById('subject').value;
  let targetSec = document.getElementById('sectionFilter').value;
  
  document.getElementById('infoBanner').textContent = `कक्षा: ${toNpNum(selectedClass)} | सेक्सन: ${targetSec} | विषय: ${sub}`;

  let students = currentData.students || [];
  let days = currentData.days || [];

  // सेक्सन अनुसार विद्यार्थी फिल्टर गर्ने
  let filteredStudents = students.filter(s => {
    if (targetSec === "ALL") return true;
    let sSec = (s.sec || "Darwin").toString().trim().toLowerCase();
    return sSec === targetSec.toLowerCase();
  });

  filteredStudents.sort((a, b) => a.name.localeCompare(b.name, 'ne'));

  let h = '<thead><tr><th rowspan="2">विद्यार्थीको नाम</th>';
  days.forEach(d => {
    h += `<th colspan="4" style="padding:3px 2px;">${formatNepaliDate(d)}</th>`;
  });
  h += '</tr><tr>';
  days.forEach(() => {
    h += `<th class="sub-th">H</th><th class="sub-th">C</th><th class="sub-th">D</th><th class="score-th">अंक</th>`;
  });
  h += '</tr></thead><tbody>';

  if (students.length === 0) {
    h += `<tr><td colspan="50" style="padding:15px; color:#d97706; font-weight:bold;">यो कक्षा र विषयमा डाटा खाली छ। तलबाट नयाँ विद्यार्थी थपेर Publish गर्नुहोस्।</td></tr>`;
  } else if (filteredStudents.length === 0) {
    h += `<tr><td colspan="50" style="padding:15px; color:#dc2626;"><b>${targetSec}</b> सेक्सनमा विद्यार्थी भेटिएनन्। 'सबै सेक्सन (All)' छान्नुहोस्।</td></tr>`;
  } else {
    filteredStudents.forEach((student) => {
      let stId = student.id;
      h += `<tr>`;
      h += `<td class="student-name-td">
              ${student.name} 
              <button class="btn-edit-sec" onclick="changeStudentSection(${stId})">✏️ ${student.sec || 'Darwin'}</button>
            </td>`;
      
      let mData = student.m || {};

      days.forEach(d => {
        let dayData = mData[d] || { hw: 0, cw: 0, dis: 0 };
        let score = (dayData.hw === 1 ? 5 : (dayData.hw === -1 ? -2.5 : 0)) +
                    (dayData.cw === 1 ? 5 : (dayData.cw === -1 ? -2.5 : 0)) +
                    (dayData.dis === 1 ? 5 : (dayData.dis === -1 ? -2.5 : 0));

        h += `<td class="cell ${getClass(dayData.hw)}" onclick="toggleMark(${stId}, '${d}', 'hw')">${getSym(dayData.hw)}</td>`;
        h += `<td class="cell ${getClass(dayData.cw)}" onclick="toggleMark(${stId}, '${d}', 'cw')">${getSym(dayData.cw)}</td>`;
        h += `<td class="cell ${getClass(dayData.dis)}" onclick="toggleMark(${stId}, '${d}', 'dis')">${getSym(dayData.dis)}</td>`;
        h += `<td class="score-cell">${toNpNum(score)}</td>`;
      });
      h += `</tr>`;
    });
  }

  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
}

function changeStudentSection(studentId) {
  let st = currentData.students.find(s => s.id == studentId);
  if (!st) return;

  let newSec = prompt(`"${st.name}" को सेक्सन फेर्नुहोस् (Darwin वा Newton):`, st.sec || "Darwin");
  if (newSec) {
    st.sec = newSec.trim();
    renderDashboard();
  }
}

function getSym(v) { return v === 1 ? '✓' : (v === -1 ? '✕' : '—'); }
function getClass(v) { return v === 1 ? 'green' : (v === -1 ? 'red' : ''); }

function toggleMark(stId, dateStr, type) {
  let st = currentData.students.find(s => s.id == stId);
  if (!st) return;
  if (!st.m) st.m = {};
  if (!st.m[dateStr]) st.m[dateStr] = { hw: 0, cw: 0, dis: 0 };

  let val = st.m[dateStr][type] || 0;
  st.m[dateStr][type] = val === 0 ? 1 : (val === 1 ? -1 : 0);
  renderDashboard();
}

function addNewDay() {
  let d = document.getElementById('newDateInput').value;
  if (!d) return alert("मिति छान्नुहोस्!");
  if (!currentData.days.includes(d)) {
    currentData.days.push(d);
    renderDashboard();
  }
}

function addNewStudent() {
  let name = document.getElementById('newStudentName').value.trim();
  let sec = document.getElementById('newStudentSec').value;
  if (!name) return alert("नाम लेख्नुहोस्!");

  currentData.students.push({ id: Date.now(), name: name, sec: sec, m: {} });
  document.getElementById('newStudentName').value = "";
  renderDashboard();
}

function publishData() {
  let selectedClass = document.getElementById('classFilter').value;
  let sub = document.getElementById('subject').value;
  let statusBox = document.getElementById('loadingStatus');
  statusBox.style.display = "block";
  statusBox.textContent = "Google Sheet मा सुरक्षित सेभ हुँदैछ...";

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ className: selectedClass, subject: sub, data: currentData })
  })
  .then(() => {
    statusBox.style.display = "none";
    alert("डाटा सफलतापूर्वक Publish भयो!");
  })
  .catch(err => {
    statusBox.style.display = "none";
    alert("डाटा Publish भयो!");
  });
}

window.onload = function() {
  document.getElementById('newDateInput').value = new Date().toISOString().split('T')[0];
  fetchServerData();
};
</script>

</body>
</html>
