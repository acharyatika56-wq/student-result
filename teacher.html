<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teacher Dashboard</title>
  
  <!-- CDN नचाहिने - Unpkg बाट विश्वव्यापी विश्वसनीय Nepali Datepicker -->
  <link rel="stylesheet" href="https://unpkg.com/nepali-date-picker@2.0.1/dist/nepaliDatePicker.min.css">
  <script src="https://unpkg.com/nepali-date-picker@2.0.1/dist/nepaliDatePicker.min.js"></script>

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;padding:15px}
    .card{background:white;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
    .add-box{background:#e0f2fe;border:2px solid #0284c7;padding:15px;border-radius:10px;margin-bottom:15px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
    label{font-weight:bold;font-size:13px;display:block;margin-bottom:4px}
    input,select,button{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font-size:14px}
    button{background:#1769aa;color:white;font-weight:bold;cursor:pointer;border:none}
    .btn-add{background:#0284c7;color:white;font-weight:bold}
    .btn-pub{background:#159447;font-size:15px;padding:10px}
    .danger{background:#c62828}
    
    .action-btn-group{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
    .btn-icon{padding:2px 6px;font-size:11px;border-radius:4px;cursor:pointer;border:none;color:white;line-height:1.2}
    .btn-edit-icon{background:#f59e0b}
    .btn-del-icon{background:#ef4444}
    
    table{border-collapse:collapse;width:100%;min-width:650px}
    th,td{border:1px solid #cbd5e1;padding:6px;text-align:center}
    th{background:#173f78;color:white}
    .sub-th{background:#1e4c8a;font-size:11px;padding:4px;width:40px}
    .cell{font-size:18px;cursor:pointer;min-width:35px;user-select:none}
    .green{background:#effaf3;color:green}
    .red{background:#fff1f1;color:red}

    .modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000}
    .modal-box{background:white;padding:20px;border-radius:8px;width:300px;box-shadow:0 4px 15px #0003}
  </style>
</head>
<body>

<h2>👨‍🏫 शिक्षक ड्यासबोर्ड (Teacher Panel)</h2>

<!-- १. विद्यार्थी तथा मिति व्यवस्थापन -->
<div class="add-box">
  <h3 style="margin:0 0 10px 0;color:#0369a1;">➕ विद्यार्थी र मिति व्यवस्थापन</h3>
  <div class="grid">
    <div>
      <label>विद्यार्थीको नाम:</label>
      <input id="newStudent" placeholder="पूरा नाम लेख्नुहोस्...">
    </div>
    <div>
      <label>सेक्सन:</label>
      <select id="newSec">
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div style="align-self:end">
      <button class="btn-add" onclick="addStudent()">+ विद्यार्थी थप्नुहोस्</button>
    </div>
    <div>
      <label>मिति छान्नुहोस् (वि.सं.):</label>
      <input id="date" type="text" placeholder="नेपाली मिति छान्नुहोस्" style="background:#fff; cursor:pointer;" readonly>
    </div>
    <div style="align-self:end">
      <button class="btn-add" onclick="addDay()">+ मिति थप्नुहोस्</button>
    </div>
  </div>
</div>

<!-- २. कक्षा, विषय र फिल्टर -->
<div class="card grid">
  <div>
    <label>कक्षा (Class):</label>
    <select id="className" onchange="onClassChange()">
      <option value="8">Class 8</option>
      <option value="9" selected>Class 9</option>
      <option value="10">Class 10</option>
    </select>
  </div>
  <div>
    <label>विषय (Subject):</label>
    <select id="subject" onchange="loadCurrentSubjectData()"></select>
  </div>
  <div>
    <label>सेक्सन (Filter):</label>
    <select id="sectionFilter" onchange="render()">
      <option value="ALL">सबै (ALL)</option>
      <option value="Darwin">Darwin</option>
      <option value="Newton">Newton</option>
    </select>
  </div>
  <div style="align-self:end">
    <button class="btn-pub" onclick="publishData()">🌐 Publish गर्नुहोस्</button>
  </div>
  <div style="align-self:end">
    <button class="danger" onclick="resetCurrentSubject()">यो विषयको Data Reset</button>
  </div>
</div>

<!-- ३. मुख्य टेबल -->
<div class="card" style="overflow:auto">
  <table id="tbl"></table>
</div>

<!-- ४. Edit Modal -->
<div id="editModal" class="modal-overlay">
  <div class="modal-box">
    <h3 style="margin-top:0">विद्यार्थी सच्याउनुहोस्</h3>
    <input type="hidden" id="editStId">
    <div style="margin-bottom:10px">
      <label>नाम:</label>
      <input id="editStName" type="text">
    </div>
    <div style="margin-bottom:15px">
      <label>सेक्सन:</label>
      <select id="editStSec">
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div style="display:flex;gap:10px">
      <button style="background:#159447" onclick="saveEdit()">Save</button>
      <button style="background:#666" onclick="closeEditModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzRceiAgW7MRrJtHTJ8u9a_VAw_IEow72UltTQGvR-kxScQZOElvRgpVdHkTX0C7dnY6g/exec";

const SUBJECTS = {
  "8": ["Math", "Science", "Nepali", "English-I", "English-II", "Social Studies", "Hamro Rapti"],
  "9": ["Math", "Science", "Nepali", "English", "Social Studies", "Opt.Math", "Computer Science"],
  "10": ["Math", "Science", "Nepali", "English", "Social Studies", "Opt.Math", "Computer Science"]
};

const defaultClass9Names = ['Aakriti Sunar','Arju KC','Aashika Khanal','Aashim Chaudhary','Aayush Kumal','Abdul Raheman Manihar','Akhil Pokhrel','Amit KC','Bibek Bhandari','Biggest Rayamajhi','Chahat Khatun','Elina Gurung','Grishma Acharya','Janaka Saru Magar','Karishma Budha Magar','Monika KC','Niraj Thapa','Prabin Pun Magar','Prabina Nepali','Prince Rana Magar','Rachana Shrestha','Sadikshya Gaire','Sajal Shrestha','Samjhana Thapa','Samyog Kalakheti','Shailesh BC','Shishir Chaudhary','Sushant Sunar','Swastika Kumal'];

let currentRoster = []; 
let D = { m: {}, days: [] };

function getRosterKey(cls) { return `class_roster_C${cls}`; }

function loadClassRoster(cls) {
  let saved = localStorage.getItem(getRosterKey(cls));
  if (saved) {
    currentRoster = JSON.parse(saved);
  } else {
    if (cls === "9") {
      currentRoster = defaultClass9Names.map((n, i) => ({ id: "st_" + Date.now() + "_" + i, name: n, sec: 'Darwin' }));
    } else {
      currentRoster = [];
    }
    saveClassRoster(cls);
  }
}

function saveClassRoster(cls) {
  localStorage.setItem(getRosterKey(cls), JSON.stringify(currentRoster));
}

function getSubjectKey() {
  let c = document.getElementById('className').value;
  let s = document.getElementById('subject').value || 'General';
  return `dailyMarks_C${c}_S${s}`;
}

function loadCurrentSubjectData() {
  let saved = localStorage.getItem(getSubjectKey());
  D = saved ? JSON.parse(saved) : { m: {}, days: [] };
  render();
}

function saveSubjectData() {
  localStorage.setItem(getSubjectKey(), JSON.stringify(D));
}

function onClassChange() {
  let cls = document.getElementById('className').value;
  loadClassRoster(cls);
  updateSubjectsList();
  loadCurrentSubjectData();
}

function updateSubjectsList() {
  let cls = document.getElementById('className').value;
  let subSelect = document.getElementById('subject');
  subSelect.innerHTML = "";
  (SUBJECTS[cls] || []).forEach(sub => {
    let opt = document.createElement('option');
    opt.value = sub;
    opt.textContent = sub;
    subSelect.appendChild(opt);
  });
}

function addStudent() {
  let cls = document.getElementById('className').value;
  let nameInput = document.getElementById('newStudent');
  let name = nameInput.value.trim();
  let sec = document.getElementById('newSec').value;

  if (!name) return alert('कृपया विद्यार्थीको नाम लेख्नुहोस्!');

  let newSt = { id: "st_" + Date.now(), name: name, sec: sec };
  currentRoster.push(newSt);
  saveClassRoster(cls);

  nameInput.value = '';
  render();
}

function openEditModal(stId) {
  let st = currentRoster.find(s => s.id === stId);
  if (!st) return;
  document.getElementById('editStId').value = st.id;
  document.getElementById('editStName').value = st.name;
  document.getElementById('editStSec').value = st.sec;
  document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal() {
  document.getElementById('editModal').style.display = 'none';
}

function saveEdit() {
  let cls = document.getElementById('className').value;
  let stId = document.getElementById('editStId').value;
  let newName = document.getElementById('editStName').value.trim();
  let newSec = document.getElementById('editStSec').value;

  if (!newName) return alert("नाम खाली राख्न मिल्दैन।");

  let st = currentRoster.find(s => s.id === stId);
  if (st) {
    st.name = newName;
    st.sec = newSec;
    saveClassRoster(cls);
    render();
  }
  closeEditModal();
}

function deleteStudent(stId) {
  let cls = document.getElementById('className').value;
  let st = currentRoster.find(s => s.id === stId);
  if (!st) return;

  if (confirm(`के तपाईं "${st.name}" लाई हटाउन चाहनुहुन्छ?`)) {
    currentRoster = currentRoster.filter(s => s.id !== stId);
    saveClassRoster(cls);
    render();
  }
}

function addDay() {
  let d = document.getElementById('date').value;
  if (d && !D.days.includes(d)) { 
    D.days.push(d); 
    D.days.sort(); 
    saveSubjectData(); 
    render(); 
  } else if (D.days.includes(d)) {
    alert('यो मिति पहिले नै थपिइसकेको छ।');
  }
}

function clickCell(stId, d, k) {
  if (!D.m[stId]) D.m[stId] = {};
  let a = D.m[stId][d] || {};
  let v = a[k] || 0;
  a[k] = v === 0 ? 1 : v === 1 ? -1 : 0;
  D.m[stId][d] = a; 
  saveSubjectData(); 
  render();
}

function score(stId) {
  let z = 0;
  let studentMarks = D.m[stId] || {};
  Object.values(studentMarks).forEach(a => {
    Object.values(a).forEach(v => z += v == 1 ? 5 : v == -1 ? -2.5 : 0);
  });
  return z;
}

function render() {
  let filterSec = document.getElementById('sectionFilter').value;
  let filteredStudents = currentRoster.filter(s => filterSec === 'ALL' || s.sec === filterSec);

  let h = '<thead><tr><th rowspan="2">क्र.सं.</th><th rowspan="2">विद्यार्थीको नाम</th><th rowspan="2">सेक्सन</th>';
  D.days.forEach(d => {
    h += `<th colspan="3" style="border-bottom:1px solid #ffffff44;padding:6px;">${d}</th>`;
  });
  h += '<th rowspan="2">अंक</th></tr>';

  h += '<tr>';
  D.days.forEach(() => {
    h += '<th class="sub-th">HW</th><th class="sub-th">CW</th><th class="sub-th">DIS</th>';
  });
  h += '</tr></thead><tbody>';

  filteredStudents.forEach((s, i) => {
    h += `<tr>
      <td>${i + 1}</td>
      <td style="text-align:left;font-weight:bold;padding-left:8px">
        ${s.name}
        <span class="action-btn-group">
          <button class="btn-icon btn-edit-icon" onclick="openEditModal('${s.id}')" title="Edit">✏️</button>
          <button class="btn-icon btn-del-icon" onclick="deleteStudent('${s.id}')" title="Delete">🗑️</button>
        </span>
      </td>
      <td>${s.sec}</td>`;
    
    D.days.forEach(d => {
      let a = (D.m[s.id] && D.m[s.id][d]) ? D.m[s.id][d] : {};
      ['hw', 'cw', 'dis'].forEach(k => {
        let v = a[k] || 0;
        h += `<td class="cell ${v == 1 ? 'green' : v == -1 ? 'red' : ''}" onclick="clickCell('${s.id}','${d}','${k}')">${v == 1 ? '✓' : v == -1 ? '✕' : '—'}</td>`;
      });
    });
    h += `<td><b>${score(s.id)}</b></td></tr>`;
  });

  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
}

function publishData() {
  let cls = document.getElementById('className').value;
  let sub = document.getElementById('subject').value;

  let formattedStudents = currentRoster.map(st => ({
    name: st.name,
    sec: st.sec,
    m: D.m[st.id] || {}
  }));

  let payload = {
    className: cls,
    subject: sub,
    data: {
      students: formattedStudents,
      days: D.days
    }
  };

  let iframe = document.createElement('iframe');
  iframe.name = 'hidden_iframe';
  iframe.style.display = 'none';
  document.body.appendChild(iframe);

  let form = document.createElement('form');
  form.method = 'POST';
  form.action = API_URL;
  form.target = 'hidden_iframe';

  let input = document.createElement('input');
  input.type = 'hidden';
  input.name = 'postData';
  input.value = JSON.stringify(payload);
  form.appendChild(input);

  document.body.appendChild(form);
  form.submit();

  setTimeout(() => {
    document.body.removeChild(form);
    document.body.removeChild(iframe);
    alert(`Class ${cls} - ${sub} को डाटा सफलतापूर्वक Publish भयो!`);
  }, 1000);
}

function resetCurrentSubject() {
  if (confirm('यो विषयको डाटा/अंकहरू मात्र हटाउने?')) { 
    localStorage.removeItem(getSubjectKey()); 
    loadCurrentSubjectData(); 
  }
}

// Window load हुँदा nepaliDatePicker Initialization
window.addEventListener('DOMContentLoaded', function() {
  var dateInput = document.getElementById('date');
  if (dateInput) {
    dateInput.nepaliDatePicker({
      dateFormat: '%y-%m-%d',
      closeOnDateSelect: true
    });
  }
});

onClassChange();
</script>
</body>
</html>
