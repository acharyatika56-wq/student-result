<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parents View - Student Homework & Discipline Tracker</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;padding:15px}
    .card{background:white;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
    label{font-weight:bold;font-size:13px;display:block;margin-bottom:4px}
    input,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font-size:14px}
    
    table{border-collapse:collapse;width:100%;min-width:650px}
    th,td{border:1px solid #cbd5e1;padding:6px;text-align:center}
    th{background:#173f78;color:white}
    .sub-th{background:#1e4c8a;font-size:11px;padding:4px;width:35px}
    .cell{font-size:18px;min-width:35px;user-select:none}
    .green{background:#effaf3;color:green}
    .red{background:#fff1f1;color:red}

    #status{text-align:center;padding:20px;font-weight:bold;color:#666}
  </style>
</head>
<body>

<h2>👨‍👩‍👧 विद्यार्थी प्रगति विवरण (Parents Panel)</h2>

<!-- १. फिल्टर र खोजी -->
<div class="card grid">
  <div>
    <label>कक्षा (Class):</label>
    <select id="className" onchange="fetchData()">
      <option value="8">Class 8</option>
      <option value="9" selected>Class 9</option>
      <option value="10">Class 10</option>
    </select>
  </div>
  <div>
    <label>विषय (Subject):</label>
    <select id="subject" onchange="fetchData()"></select>
  </div>
  <div>
    <label>सेक्सन (Filter):</label>
    <select id="sectionFilter" onchange="render()">
      <option value="ALL">सबै (ALL)</option>
      <option value="Darwin">Darwin</option>
      <option value="Newton">Newton</option>
    </select>
  </div>
  <div>
    <label>विद्यार्थीको नाम खोज्नुहोस्:</label>
    <input id="searchName" placeholder="नाम टाइप गर्नुहोस्..." oninput="render()">
  </div>
</div>

<!-- २. मुख्य टेबल -->
<div class="card" style="overflow:auto">
  <div id="status">डाटा लोड हुँदैछ...</div>
  <table id="tbl" style="display:none;"></table>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzRceiAgW7MRrJtHTJ8u9a_VAw_IEow72UltTQGvR-kxScQZOElvRgpVdHkTX0C7dnY6g/exec";

const SUBJECTS = {
  "8": ["Math", "Science", "Nepali", "English-I", "English-II", "Social Studies", "Hamro Rapti"],
  "9": ["Math", "Science", "Nepali", "English", "Social Studies", "Opt.Math", "Computer Science"],
  "10": ["Math", "Science", "Nepali", "English", "Social Studies", "Opt.Math", "Computer Science"]
};

let currentData = { students: [], days: [] };

function updateSubjectsList() {
  let cls = document.getElementById('className').value;
  let subSelect = document.getElementById('subject');
  subSelect.innerHTML = "";
  (SUBJECTS[cls] || []).forEach(sub => {
    let opt = document.createElement('option');
    opt.value = sub;
    opt.textContent = sub;
    subSelect.appendChild(opt);
  });
}

function fetchData() {
  let cls = document.getElementById('className').value;
  let sub = document.getElementById('subject').value;
  
  document.getElementById('status').style.display = "block";
  document.getElementById('status').textContent = "डाटा लोड हुँदैछ...";
  document.getElementById('tbl').style.display = "none";

  fetch(`${API_URL}?className=${cls}&subject=${sub}`)
    .then(res => res.json())
    .then(data => {
      currentData = data || { students: [], days: [] };
      render();
    })
    .catch(err => {
      console.error(err);
      document.getElementById('status').textContent = "डाटा लोड गर्न सकिएन। कृपया पुनः प्रयास गर्नुहोस्।";
    });
}

function score(student) {
  let z = 0;
  let studentMarks = student.m || {};
  Object.values(studentMarks).forEach(a => {
    Object.values(a).forEach(v => z += v == 1 ? 5 : v == -1 ? -2.5 : 0);
  });
  return z;
}

function render() {
  let secFilter = document.getElementById('sectionFilter').value;
  let search = document.getElementById('searchName').value.toLowerCase().trim();

  let filtered = (currentData.students || []).filter(s => {
    let matchesSec = secFilter === 'ALL' || s.sec === secFilter;
    let matchesName = (s.name || '').toLowerCase().includes(search);
    return matchesSec && matchesName;
  });

  if (!filtered || filtered.length === 0) {
    document.getElementById('status').style.display = "block";
    document.getElementById('status').textContent = "कुनै विद्यार्थी भेटिएन वा डाटा उपलब्ध छैन।";
    document.getElementById('tbl').style.display = "none";
    return;
  }

  document.getElementById('status').style.display = "none";
  document.getElementById('tbl').style.display = "table";

  // १. पहिलो Row मा मितिहरू (वि.सं.)
  let h = '<thead><tr><th rowspan="2">क्र.सं.</th><th rowspan="2">विद्यार्थीको नाम</th><th rowspan="2">सेक्सन</th>';
  (currentData.days || []).forEach(d => {
    h += `<th colspan="3" style="border-bottom:1px solid #ffffff44;padding:6px;">${d}</th>`;
  });
  h += '<th rowspan="2">अंक</th></tr>';

  // २. दोस्रो Row मा HW, CW, DIS
  h += '<tr>';
  (currentData.days || []).forEach(() => {
    h += '<th class="sub-th">HW</th><th class="sub-th">CW</th><th class="sub-th">DIS</th>';
  });
  h += '</tr></thead><tbody>';

  // ३. डेटा Rows (टिक/क्रस र अंक)
  filtered.forEach((s, i) => {
    h += `<tr>
      <td>${i + 1}</td>
      <td style="text-align:left;font-weight:bold;padding-left:8px">${s.name}</td>
      <td>${s.sec || ''}</td>`;

    (currentData.days || []).forEach(d => {
      let a = (s.m && s.m[d]) ? s.m[d] : {};
      ['hw', 'cw', 'dis'].forEach(k => {
        let v = a[k] || 0;
        h += `<td class="cell ${v == 1 ? 'green' : v == -1 ? 'red' : ''}">${v == 1 ? '✓' : v == -1 ? '✕' : '—'}</td>`;
      });
    });

    h += `<td><b>${score(s)}</b></td></tr>`;
  });

  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
}

// Initial Load
updateSubjectsList();
fetchData();
</script>
</body>
</html>
