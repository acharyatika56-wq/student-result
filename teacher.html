<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class 9 Teacher Dashboard</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;padding:8px}
    .card{background:white;border-radius:8px;padding:8px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,0.05)}
    .filter-box{background:#e0f2fe;border:1px solid #0284c7;padding:8px;border-radius:8px;margin-bottom:8px}
    
    .rule-info-box{background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
    .rule-item{display:inline-flex;align-items:center;gap:4px;font-weight:bold}
    .rule-badge{display:inline-block;padding:1px 5px;border-radius:3px;color:white;font-weight:bold;font-size:11px}
    .bg-green{background:#16a34a}
    .bg-red{background:#dc2626}
    .bg-gray{background:#64748b}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
    label{font-weight:bold;font-size:11px;display:block;margin-bottom:2px}
    select,input,button{width:100%;padding:5px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px}
    button{background:#1769aa;color:white;font-weight:bold;cursor:pointer;border:none}
    .btn-pub{background:#16a34a;margin-top:6px}
    .btn-add{background:#0284c7;margin-top:6px}
    .btn-edit-sec{background:#eab308;color:#000;font-size:9px;padding:1px 4px;margin-left:4px;border-radius:3px;cursor:pointer}

    table{border-collapse:collapse;width:100%;table-layout:auto;}
    th,td{border:1px solid #cbd5e1;padding:2px 3px;text-align:center;font-size:11px}
    th{background:#173f78;color:white;font-size:11px}
    .sub-th{background:#1e4c8a;font-size:9px;padding:2px;width:22px}
    .score-th{background:#0d5257;font-size:9px;padding:2px;width:28px;color:#fff}
    .cell{font-size:12px;min-width:20px;user-select:none;font-weight:bold;cursor:pointer}
    .green{background:#effaf3;color:green}
    .red{background:#fff1f1;color:red}
    .score-cell{background:#e2f8ff;font-weight:bold;color:#0369a1;font-size:11px}
    
    .student-name-td{text-align:left;padding-left:5px;font-weight:bold;background:#f8fafc;font-size:11px;white-space:nowrap}
    #loadingStatus{text-align:center;padding:8px;font-weight:bold;color:#0284c7;background:#e0f2fe;border-radius:4px;margin-bottom:8px;display:none;font-size:12px}
    .section-title{font-size:13px;font-weight:bold;color:#0369a1;margin-bottom:6px}
  </style>
</head>
<body>

<h3 style="margin:0 0 6px 0;font-size:16px;">👨‍🏫 Class 9 - Teacher Entry Panel</h3>

<div id="loadingStatus">सर्भरबाट डाटा लोड हुँदैछ...</div>

<div class="rule-info-box">
  <span style="font-weight:bold;color:#1e293b;">📌 नियम:</span>
  <div class="rule-item"><span class="rule-badge bg-green">✓</span><span>+५ (गरेको)</span></div>
  <div class="rule-item"><span class="rule-badge bg-red">✕</span><span>-२.५ (नगरेको)</span></div>
  <div class="rule-item"><span class="rule-badge bg-gray">—</span><span>० (खाली)</span></div>
</div>

<div class="filter-box">
  <div class="grid">
    <div>
      <label>सेक्सन (Section):</label>
      <select id="sectionFilter" onchange="renderDashboard()">
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div>
      <label>विषय (Subject):</label>
      <select id="subject" onchange="fetchServerData()">
        <option value="Math">Math</option>
        <option value="Science">Science</option>
        <option value="Nepali">Nepali</option>
        <option value="English">English</option>
        <option value="Social Studies">Social Studies</option>
        <option value="Opt.Math">Opt.Math</option>
        <option value="Computer Science">Computer Science</option>
      </select>
    </div>
    <div>
      <label>नयाँ मिति थप्नुहोस्:</label>
      <input type="date" id="newDateInput">
    </div>
    <div style="align-self:end">
      <button class="btn-add" onclick="addNewDay()">+ मिति थप्नुहोस्</button>
    </div>
  </div>

  <div class="grid" style="margin-top:8px; border-top:1px dashed #0284c7; padding-top:8px;">
    <div>
      <label>नयाँ विद्यार्थी नाम:</label>
      <input type="text" id="newStudentName" placeholder="नाम...">
    </div>
    <div>
      <label>सेक्सन छान्नुहोस्:</label>
      <select id="newStudentSec">
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div style="align-self:end">
      <button class="btn-add" onclick="addNewStudent()">+ विद्यार्थी थप्नुहोस्</button>
    </div>
    <div style="align-self:end">
      <button class="btn-pub" onclick="publishData()">🌐 सुरक्षित Publish गर्नुहोस्</button>
    </div>
  </div>
</div>

<div class="card">
  <div id="infoBanner" class="section-title">कक्षा: ९ | सेक्सन: Darwin | विषय: Math</div>
  <div style="width:100%;overflow-x:auto;">
    <table id="tbl"></table>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwb1ilFmQOAzFcnRcTLKvgV2s74SbQlsqWlihIqzFSr7CEDCrjx1mDnCH5LFTaMJN9_kw/exec";
const CLASS_NAME = "9";

let currentData = {
  students: [],
  days: []
};

// १. अङ्कलाई नेपालीमा फेर्ने फसन
function toNepaliDigits(str) {
  if (!str) return '';
  const npDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
  return str.toString().replace(/[0-9]/g, function(w) {
    return npDigits[parseInt(w)];
  });
}

// २. AD मितिलाई BS नेपाली ढाँचामा देखाउने फसन
function formatNepaliDate(dateStr) {
  if (!dateStr) return '';
  let parts = dateStr.split('-');
  if (parts.length === 3) {
    // सरल वर्ष र मिति रूपान्तरण (अनुमानित +57 वर्ष)
    let y = parseInt(parts[0]);
    let m = parseInt(parts[1]);
    let d = parseInt(parts[2]);
    
    // मिति समायोजन
    let bsYear = y + 57;
    let bsMonth = m + 8;
    if (bsMonth > 12) {
      bsMonth -= 12;
    }
    
    let monthNames = ["बैशाख", "जेठ", "असार", "साउन", "भदौ", "असोज", "कार्तिक", "मंसिर", "पुस", "माघ", "फागुन", "चैत"];
    let monthNameStr = monthNames[bsMonth - 1] || `${bsMonth}`;

    return `${monthNameStr} ${toNepaliDigits(d)}`;
  }
  return toNepaliDigits(dateStr);
}

function fetchServerData() {
  let sub = document.getElementById('subject').value;
  let statusBox = document.getElementById('loadingStatus');
  statusBox.style.display = "block";
  statusBox.textContent = "सर्भरबाट डाटा ल्याउँदैछ...";

  fetch(`${API_URL}?className=${CLASS_NAME}&subject=${sub}`)
    .then(res => res.json())
    .then(data => {
      statusBox.style.display = "none";
      if (data && data.students) {
        currentData = data;
      } else {
        currentData = { students: [], days: [] };
      }
      renderDashboard();
    })
    .catch(err => {
      console.error(err);
      statusBox.style.display = "none";
      renderDashboard();
    });
}

function getSingleDayScore(dayData) {
  if (!dayData) return 0;
  let score = 0;
  ['hw', 'cw', 'dis'].forEach(key => {
    let val = dayData[key];
    if (val === 1) score += 5;
    else if (val === -1) score -= 2.5;
  });
  return score;
}

function renderDashboard() {
  let sub = document.getElementById('subject').value;
  let targetSec = document.getElementById('sectionFilter').value;
  
  let banner = document.getElementById('infoBanner');
  banner.textContent = `कक्षा: ${toNepaliDigits(CLASS_NAME)} | सेक्सन: ${targetSec} | विषय: ${sub}`;

  let students = currentData.students || [];
  let days = currentData.days || [];

  let filteredStudents = students.filter(s => {
    let studentSec = s.sec ? s.sec.toString().trim().toLowerCase() : "darwin";
    return studentSec === targetSec.toString().trim().toLowerCase();
  });

  filteredStudents.sort((a, b) => a.name.localeCompare(b.name, 'ne'));

  let h = '<thead><tr><th rowspan="2">विद्यार्थीको नाम</th>';
  days.forEach(d => {
    let npDate = formatNepaliDate(d);
    h += `<th colspan="4" style="padding:3px 2px;font-size:11px;">${npDate}</th>`;
  });
  h += '</tr><tr>';
  days.forEach(() => {
    h += `<th class="sub-th">H</th><th class="sub-th">C</th><th class="sub-th">D</th><th class="score-th">अंक</th>`;
  });
  h += '</tr></thead><tbody>';

  if (students.length === 0) {
    h += `<tr><td colspan="50" style="padding:10px; color:#666;">यो विषयमा अझै डाटा छैन। तलबाट विद्यार्थी वा मिति थप्नुहोस्।</td></tr>`;
  } else if (filteredStudents.length === 0) {
    h += `<tr><td colspan="50" style="padding:15px; color:#dc2626;"><b>${targetSec}</b> सेक्सनमा कुनै विद्यार्थी भेटिएन। तलबाट नयाँ विद्यार्थी थप्नुहोस्।</td></tr>`;
  } else {
    filteredStudents.forEach((student) => {
      let stId = student.id;
      h += `<tr>`;
      h += `<td class="student-name-td">
              ${student.name} 
              <button class="btn-edit-sec" onclick="changeStudentSection(${stId})" title="सेक्सन फेर्नुहोस्">✏️ ${student.sec || 'Darwin'}</button>
            </td>`;
      
      let studentMarks = student.m || {};

      days.forEach(d => {
        let dayData = studentMarks[d] || { hw: 0, cw: 0, dis: 0 };
        let dailyScore = getSingleDayScore(dayData);

        h += `<td class="cell ${getClass(dayData.hw)}" onclick="toggleMark(${stId}, '${d}', 'hw')">${getSymbol(dayData.hw)}</td>`;
        h += `<td class="cell ${getClass(dayData.cw)}" onclick="toggleMark(${stId}, '${d}', 'cw')">${getSymbol(dayData.cw)}</td>`;
        h += `<td class="cell ${getClass(dayData.dis)}" onclick="toggleMark(${stId}, '${d}', 'dis')">${getSymbol(dayData.dis)}</td>`;
        h += `<td class="score-cell">${toNepaliDigits(dailyScore)}</td>`;
      });
      h += `</tr>`;
    });
  }

  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
}

function changeStudentSection(studentId) {
  let st = currentData.students.find(s => s.id == studentId);
  if (!st) return;

  let newSec = prompt(`"${st.name}" को नयाँ सेक्सन टाइप गर्नुहोस् (Darwin वा Newton):`, st.sec || "Darwin");
  if (newSec) {
    newSec = newSec.trim();
    if (newSec.toLowerCase() === "darwin" || newSec.toLowerCase() === "newton") {
      st.sec = newSec.charAt(0).toUpperCase() + newSec.slice(1).toLowerCase();
      renderDashboard();
    } else {
      alert("कृपया केवल 'Darwin' वा 'Newton' मात्र लेख्नुहोस्।");
    }
  }
}

function getSymbol(val) {
  if (val === 1) return '✓';
  if (val === -1) return '✕';
  return '—';
}

function getClass(val) {
  if (val === 1) return 'green';
  if (val === -1) return 'red';
  return '';
}

function toggleMark(studentId, dateStr, type) {
  let st = currentData.students.find(s => s.id == studentId);
  if (!st) return;
  if (!st.m) st.m = {};
  if (!st.m[dateStr]) st.m[dateStr] = { hw: 0, cw: 0, dis: 0 };

  let currentVal = st.m[dateStr][type] || 0;
  if (currentVal === 0) st.m[dateStr][type] = 1;
  else if (currentVal === 1) st.m[dateStr][type] = -1;
  else st.m[dateStr][type] = 0;

  renderDashboard();
}

function addNewDay() {
  let dateVal = document.getElementById('newDateInput').value;
  if (!dateVal) {
    alert("कृपया मिति छान्नुहोस्!");
    return;
  }
  if (!currentData.days.includes(dateVal)) {
    currentData.days.push(dateVal);
    renderDashboard();
  } else {
    alert("यो मिति पहिले नै छ।");
  }
}

function addNewStudent() {
  let name = document.getElementById('newStudentName').value.trim();
  let sec = document.getElementById('newStudentSec').value;

  if (!name) {
    alert("विद्यार्थीको नाम लेख्नुहोस्!");
    return;
  }

  let newId = Date.now();
  currentData.students.push({
    id: newId,
    name: name,
    sec: sec,
    m: {}
  });

  document.getElementById('newStudentName').value = "";
  document.getElementById('sectionFilter').value = sec;
  renderDashboard();
}

function publishData() {
  let sub = document.getElementById('subject').value;
  let statusBox = document.getElementById('loadingStatus');
  statusBox.style.display = "block";
  statusBox.textContent = "Google Sheet मा सेभ हुँदैछ...";

  let payload = {
    className: CLASS_NAME,
    subject: sub,
    data: currentData
  };

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    statusBox.style.display = "none";
    alert("डाटा सफलतापूर्वक Publish भयो!");
  })
  .catch(err => {
    console.error(err);
    statusBox.style.display = "none";
    alert("सेभ हुन सकेन।");
  });
}

window.onload = function() {
  let today = new Date().toISOString().split('T')[0];
  document.getElementById('newDateInput').value = today;
  fetchServerData();
};
</script>

</body>
</html>
