<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teacher Dashboard</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;padding:15px}
    .card{background:white;border-radius:12px;padding:15px;margin-bottom:15px;box-shadow:0 2px 10px #0001}
    .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
    label{font-weight:bold;font-size:13px}
    input,select,button{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font-size:14px}
    button{background:#1769aa;color:white;font-weight:bold;cursor:pointer;border:none}
    .btn-pub{background:#159447}.danger{background:#c62828}
    table{border-collapse:collapse;width:100%;min-width:600px}
    th,td{border:1px solid #ddd;padding:6px;text-align:center}th{background:#173f78;color:white}
    .cell{font-size:20px;cursor:pointer;min-width:35px;user-select:none}
    .green{background:#effaf3;color:green}.red{background:#fff1f1;color:red}
  </style>
</head>
<body>

<h2>👨‍🏫 शिक्षक ड्यासबोर्ड (Teacher Panel)</h2>

<div class="card">
  <div class="controls">
    <div><label>कक्षा</label><input id="className" value="९"></div>
    <div>
      <label>सेक्सन (Filter)</label>
      <select id="sectionFilter" onchange="render()">
        <option value="ALL">सबै (ALL)</option>
        <option value="Darwin">Darwin</option>
        <option value="Einstein">Einstein</option>
      </select>
    </div>
    <div><label>विषय</label><input id="subject" value="गणित"></div>
    <div><label>मिति</label><input id="date" type="date"></div>
    <div><label>नयाँ विद्यार्थी</label><input id="newStudent" placeholder="नाम"></div>
    <div>
      <label>सेक्सन</label>
      <select id="newSec">
        <option value="Darwin">Darwin</option>
        <option value="Einstein">Einstein</option>
      </select>
    </div>
  </div>
  
  <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;">
    <button onclick="addStudent()">+ विद्यार्थी थप्नुहोस्</button>
    <button onclick="addDay()">+ मिति थप्नुहोस्</button>
    <button class="btn-pub" onclick="publishData()">🌐 अनलाइन Publish गर्नुहोस्</button>
    <button class="danger" onclick="resetAll()">सबै Data हटाउनुहोस्</button>
  </div>
</div>

<div class="card" style="overflow:auto">
  <table id="tbl"></table>
</div>

<script>
// नयाँ Google Apps Script Web App URL
const API_URL = "https://script.google.com/macros/s/AKfycbzRceiAgW7MRrJtHTJ8u9a_VAw_IEow72UltTQGvR-kxScQZOElvRgpVdHkTX0C7dnY6g/exec";
const KEY = 'dailyTeacherV5';

const defaultNames = ['Aakriti Sunar','Arju KC','Aashika Khanal','Aashim Chaudhary','Aayush Kumal','Abdul Raheman Manihar','Akhil Pokhrel','Amit KC','Bibek Bhandari','Biggest Rayamajhi','Chahat Khatun','Elina Gurung','Grishma Acharya','Janaka Saru Magar','Karishma Budha Magar','Monika KC','Niraj Thapa','Prabin Pun Magar','Prabina Nepali','Prince Rana Magar','Rachana Shrestha','Sadikshya Gaire','Sajal Shrestha','Samjhana Thapa','Samyog Kalakheti','Shailesh BC','Shishir Chaudhary','Sushant Sunar','Swastika Kumal'];

let D = JSON.parse(localStorage.getItem(KEY) || 'null') || { students: [], days: [] };

if (!D.students.length) {
  D.students = defaultNames.map(n => ({ name: n, sec: 'Darwin', m: {} }));
}

document.getElementById('date').value = new Date().toISOString().slice(0, 10);
render();

function addStudent() {
  let e = document.getElementById('newStudent'), n = e.value.trim();
  let sec = document.getElementById('newSec').value;
  if (!n) return alert('नाम लेख्नुहोस्');
  D.students.push({ name: n, sec: sec, m: {} });
  e.value = ''; save(); render();
}

function addDay() {
  let d = document.getElementById('date').value;
  if (d && !D.days.includes(d)) { D.days.push(d); D.days.sort(); save(); render(); }
}

function clickCell(studentIndex, d, k) {
  let s = D.students[studentIndex];
  let a = s.m[d] || {};
  let v = a[k] || 0;
  a[k] = v === 0 ? 1 : v === 1 ? -1 : 0;
  s.m[d] = a; save(); render();
}

function score(s) {
  let z = 0;
  Object.values(s.m || {}).forEach(a => Object.values(a).forEach(v => z += v == 1 ? 5 : v == -1 ? -2.5 : 0));
  return z;
}

function getFilteredStudents() {
  let f = document.getElementById('sectionFilter').value;
  if (f === 'ALL') return D.students.map((s, idx) => ({ ...s, originalIndex: idx }));
  return D.students.map((s, idx) => ({ ...s, originalIndex: idx })).filter(s => s.sec === f);
}

function render() {
  let filtered = getFilteredStudents();
  let h = '<tr><th>क्र.सं.</th><th>विद्यार्थी</th><th>सेक्सन</th>';
  D.days.forEach(d => h += `<th colspan="3">${d}<br><small>HW|CW|DIS</small></th>`);
  h += '<th>अंक</th></tr>';

  filtered.forEach((s, i) => {
    h += `<tr><td>${i + 1}</td><td style="text-align:left;font-weight:bold">${s.name}</td><td>${s.sec || ''}</td>`;
    D.days.forEach(d => {
      let a = s.m[d] || {};
      ['hw', 'cw', 'dis'].forEach(k => {
        let v = a[k] || 0;
        h += `<td class="cell ${v == 1 ? 'green' : v == -1 ? 'red' : ''}" onclick="clickCell(${s.originalIndex},'${d}','${k}')">${v == 1 ? '✓' : v == -1 ? '✕' : '—'}</td>`;
      });
    });
    h += `<td><b>${score(s)}</b></td></tr>`;
  });
  document.getElementById('tbl').innerHTML = h;
}

function save() { localStorage.setItem(KEY, JSON.stringify(D)); }

function publishData() {
  let payload = {
    className: document.getElementById('className').value,
    subject: document.getElementById('subject').value,
    data: D
  };

  fetch(API_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("सफलतापूर्वक Publish भयो! अब Parents Portal मा हेर्नुहोस्।");
  })
  .catch(e => alert("समस्या आयो: " + e));
}

function resetAll() {
  if (confirm('सबै Data हटाउने?')) { localStorage.removeItem(KEY); location.reload(); }
}
</script>
</body>
</html>
