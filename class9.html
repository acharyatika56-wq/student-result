<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class 9 - All Students Report View</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;padding:8px}
    .card{background:white;border-radius:8px;padding:8px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,0.05)}
    .filter-box{background:#e0f2fe;border:1px solid #0284c7;padding:8px;border-radius:8px;margin-bottom:8px}
    
    .rule-info-box{background:#f8fafc;border:1px solid #cbd5e1;border-radius:6px;padding:6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
    .rule-item{display:inline-flex;align-items:center;gap:4px;font-weight:bold}
    .rule-badge{display:inline-block;padding:1px 5px;border-radius:3px;color:white;font-weight:bold;font-size:11px}
    .bg-green{background:#16a34a}
    .bg-red{background:#dc2626}
    .bg-gray{background:#64748b}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px}
    label{font-weight:bold;font-size:11px;display:block;margin-bottom:2px}
    select,input,button{width:100%;padding:5px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px}
    button{background:#1769aa;color:white;font-weight:bold;cursor:pointer;border:none}
    .btn-pdf{background:#ea580c;font-size:12px;padding:6px}

    table{border-collapse:collapse;width:100%;table-layout:auto;}
    th,td{border:1px solid #cbd5e1;padding:2px 3px;text-align:center;font-size:11px}
    th{background:#173f78;color:white;font-size:11px}
    .sub-th{background:#1e4c8a;font-size:9px;padding:2px;width:22px}
    .score-th{background:#0d5257;font-size:9px;padding:2px;width:28px;color:#fff}
    .cell{font-size:12px;min-width:20px;user-select:none;font-weight:bold}
    .green{background:#effaf3;color:green}
    .red{background:#fff1f1;color:red}
    .score-cell{background:#e2f8ff;font-weight:bold;color:#0369a1;font-size:11px}
    
    .total-score-cell{background:#dcfce7;font-weight:bold;color:#15803d;font-size:12px;width:45px}
    .student-name-td{text-align:left;padding-left:5px;font-weight:bold;background:#f8fafc;font-size:11px;white-space:nowrap}

    #loadingStatus{text-align:center;padding:8px;font-weight:bold;color:#0284c7;background:#e0f2fe;border-radius:4px;margin-bottom:8px;display:none;font-size:12px}
    .section-title {font-size: 13px; font-weight: bold; color: #0369a1; margin-bottom: 6px;}

    @media print {
      body { background: white; padding: 0; }
      .filter-box, .rule-info-box, button, input { display: none !important; }
      .card { box-shadow: none; padding: 0; margin: 0; }
    }
  </style>
</head>
<body>

<h3 style="margin: 0 0 6px 0; font-size: 16px;">🎓 कक्षा ९ - प्रगति प्रतिवेदन (All Students Report)</h3>

<div id="loadingStatus">सर्भरबाट डेटा लोड हुँदैछ...</div>

<div class="rule-info-box">
  <span style="font-weight:bold;color:#1e293b;">📌 नियम:</span>
  <div class="rule-item"><span class="rule-badge bg-green">✓</span><span>+५</span></div>
  <div class="rule-item"><span class="rule-badge bg-red">✕</span><span>-२.५</span></div>
  <div class="rule-item"><span class="rule-badge bg-gray">—</span><span>०</span></div>
</div>

<div class="filter-box">
  <div class="grid">
    <div>
      <label>सेक्सन (Section):</label>
      <select id="sectionFilter" onchange="fetchServerData()">
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div>
      <label>विषय (Subject):</label>
      <select id="subject" onchange="fetchServerData()">
        <option value="Math">Math</option>
        <option value="Science">Science</option>
        <option value="Nepali">Nepali</option>
        <option value="English">English</option>
        <option value="Social Studies">Social Studies</option>
        <option value="Opt.Math">Opt.Math</option>
        <option value="Computer Science">Computer Science</option>
      </select>
    </div>
    <div>
      <label>दिन (Date View):</label>
      <select id="dateRangeFilter" onchange="renderAllStudentsReport()">
        <option value="last7">अन्तिम ७ दिन (Last 7 Days)</option>
        <option value="all">सबै दिनहरू (All Days)</option>
      </select>
    </div>
    <div>
      <label>खोज्नुहोस्:</label>
      <input type="text" id="searchBox" placeholder="नाम..." onkeyup="renderAllStudentsReport()">
    </div>
    <div style="align-self:end">
      <button class="btn-pdf" onclick="window.print()">📥 प्रिन्ट / PDF</button>
    </div>
  </div>
</div>

<div class="card">
  <div id="infoBanner" class="section-title">कक्षा: ९ | सेक्सन: Darwin | विषय: Math</div>
  <div style="width: 100%; overflow-x: auto;">
    <table id="tbl"></table>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyiG7dAG9Aja2oPoqo8U4afxLmm9WSN34fXeqSOLor-ytkkb92CngGbiBDlxPNdwQ37Lw/exec";
const CLASS_NAME = "9";

let globalServerData = { students: [], days: [] };

function fetchServerData() {
  let sub = document.getElementById('subject').value;
  let targetSec = document.getElementById('sectionFilter').value;
  
  let statusBox = document.getElementById('loadingStatus');
  statusBox.style.display = "block";
  statusBox.textContent = "सर्भरबाट डेटा लोड हुँदैछ...";

  fetch(`${API_URL}?className=${CLASS_NAME}&section=${targetSec}&subject=${sub}`)
    .then(res => res.json())
    .then(data => {
      statusBox.style.display = "none";
      if (data && data.students) {
        globalServerData = data;
      } else {
        globalServerData = { students: [], days: [] };
      }
      renderAllStudentsReport();
    })
    .catch(err => {
      console.error(err);
      statusBox.textContent = "डेटा लोड गर्न सकिएन।";
      setTimeout(() => { statusBox.style.display = "none"; }, 3000);
      globalServerData = { students: [], days: [] };
      renderAllStudentsReport();
    });
}

function getSingleDayScore(dayData) {
  if (!dayData) return 0;
  let score = 0;
  ['hw', 'cw', 'dis'].forEach(key => {
    let val = dayData[key];
    if (val === 1) score += 5;
    else if (val === -1) score -= 2.5;
  });
  return score;
}

function renderAllStudentsReport() {
  let sub = document.getElementById('subject').value;
  let targetSec = document.getElementById('sectionFilter').value;
  let searchText = document.getElementById('searchBox').value.toLowerCase().trim();
  let dateRange = document.getElementById('dateRangeFilter').value;

  let banner = document.getElementById('infoBanner');
  banner.textContent = `कक्षा: ${CLASS_NAME} | सेक्सन: ${targetSec} | विषय: ${sub}`;

  let students = globalServerData.students || [];
  let days = globalServerData.days || [];

  // १. सेक्सन अनुसार Case-Insensitive Filter गर्छ
  let filteredStudents = students.filter(s => {
    let matchesSec = !s.sec || s.sec.toString().trim().toLowerCase() === targetSec.toString().trim().toLowerCase();
    let matchesSearch = s.name.toLowerCase().includes(searchText);
    return matchesSec && matchesSearch;
  });

  // २. विद्यार्थीहरूलाई वर्णानुक्रम (Alphabetical Order) अनुसार क्रमबद्ध गर्छ
  filteredStudents.sort((a, b) => a.name.localeCompare(b.name, 'ne'));

  // ३. मितिको आधारमा Filter गर्छ (अन्तिम ७ दिन मात्र छान्दा)
  let displayDays = [...days];
  if (dateRange === 'last7' && displayDays.length > 7) {
    displayDays = displayDays.slice(-7);
  }

  let h = '<thead><tr><th rowspan="2">विद्यार्थीको नाम</th>';
  
  displayDays.forEach(d => {
    h += `<th colspan="4" style="padding:2px;font-size:10px;">${d}</th>`;
  });
  
  h += '<th rowspan="2" style="background:#15803d;color:white;">जम्मा</th></tr><tr>';
  
  displayDays.forEach(() => {
    h += `<th class="sub-th">H</th><th class="sub-th">C</th><th class="sub-th">D</th><th class="score-th">अंक</th>`;
  });
  
  h += '</tr></thead><tbody>';

  if (displayDays.length === 0) {
    h += `<tr><td colspan="50" style="padding:10px; color:#666;">कुनै पनि दिनको रेकर्ड उपलब्ध छैन।</td></tr>`;
  } else if (filteredStudents.length === 0) {
    h += `<tr><td colspan="50" style="padding:10px; color:#666;">यो सेक्सनमा कुनै विद्यार्थी भेटिएन।</td></tr>`;
  } else {
    filteredStudents.forEach(student => {
      h += `<tr>`;
      h += `<td class="student-name-td">${student.name}</td>`;
      
      let studentMarks = student.m || {};
      let grandTotalScore = 0;

      displayDays.forEach(d => {
        let dayData = studentMarks[d] || {};
        let hw = dayData['hw'] || 0;
        let cw = dayData['cw'] || 0;
        let dis = dayData['dis'] || 0;
        
        let dailyScore = getSingleDayScore(dayData);
        grandTotalScore += dailyScore;

        h += `<td class="cell ${hw == 1 ? 'green' : hw == -1 ? 'red' : ''}">${hw == 1 ? '✓' : hw == -1 ? '✕' : '—'}</td>`;
        h += `<td class="cell ${cw == 1 ? 'green' : cw == -1 ? 'red' : ''}">${cw == 1 ? '✓' : cw == -1 ? '✕' : '—'}</td>`;
        h += `<td class="cell ${dis == 1 ? 'green' : dis == -1 ? 'red' : ''}">${dis == 1 ? '✓' : dis == -1 ? '✕' : '—'}</td>`;
        h += `<td class="score-cell">${dailyScore}</td>`;
      });

      h += `<td class="total-score-cell">${grandTotalScore}</td>`;
      h += `</tr>`;
    });
  }

  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
}

window.onload = function() {
  fetchServerData();
};
</script>

</body>
</html>
