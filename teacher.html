<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class 9 Teacher Dashboard</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033;padding:8px}
    .card{background:white;border-radius:8px;padding:8px;margin-bottom:10px;box-shadow:0 1px 5px rgba(0,0,0,0.05)}
    .filter-box{background:#e0f2fe;border:1px solid #0284c7;padding:8px;border-radius:8px;margin-bottom:8px}
    
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
    label{font-weight:bold;font-size:11px;display:block;margin-bottom:2px}
    select,input,button{width:100%;padding:5px 6px;border:1px solid #ccc;border-radius:4px;font-size:12px}
    button{background:#1769aa;color:white;font-weight:bold;cursor:pointer;border:none}
    .btn-pub{background:#16a34a;margin-top:6px}
    .btn-add{background:#0284c7;margin-top:6px}

    table{border-collapse:collapse;width:100%;table-layout:auto;}
    th,td{border:1px solid #cbd5e1;padding:2px 3px;text-align:center;font-size:11px}
    th{background:#173f78;color:white;font-size:11px}
    .sub-th{background:#1e4c8a;font-size:9px;padding:2px;width:22px}
    .cell{font-size:12px;min-width:20px;user-select:none;font-weight:bold;cursor:pointer}
    .green{background:#dcfce7;color:#15803d}
    .red{background:#fee2e2;color:#dc2626}
    
    .student-name-td{text-align:left;padding-left:5px;font-weight:bold;background:#f8fafc;font-size:11px;white-space:nowrap}
    #loadingStatus{text-align:center;padding:6px;font-weight:bold;color:#0284c7;background:#e0f2fe;border-radius:4px;margin-bottom:8px;display:none;font-size:12px}
  </style>
</head>
<body>

<h3 style="margin:0 0 6px 0;font-size:16px;">👨‍🏫 शिक्षक ड्यासबोर्ड (Teacher Dashboard)</h3>

<div id="loadingStatus">पुरानो डाटा लोड हुँदैछ...</div>

<div class="filter-box">
  <div class="grid">
    <div>
      <label>सेक्सन (Section):</label>
      <select id="sectionFilter" onchange="renderDashboard()">
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div>
      <label>विषय (Subject):</label>
      <select id="subject" onchange="fetchServerData()">
        <option value="Math">Math</option>
        <option value="Science">Science</option>
        <option value="Nepali">Nepali</option>
        <option value="English">English</option>
        <option value="Social Studies">Social Studies</option>
        <option value="Opt.Math">Opt.Math</option>
        <option value="Computer Science">Computer Science</option>
      </select>
    </div>
    <div>
      <label>नयाँ मिति थप्नुहोस्:</label>
      <input type="date" id="newDateInput">
    </div>
    <div style="align-self:end">
      <button class="btn-add" onclick="addNewDay()">+ मिति थप्नुहोस्</button>
    </div>
  </div>
  
  <div class="grid" style="margin-top:6px;">
    <div>
      <input type="text" id="newStudentName" placeholder="विद्यार्थीको नाम...">
    </div>
    <div>
      <select id="newStudentSec">
        <option value="Darwin">Darwin</option>
        <option value="Newton">Newton</option>
      </select>
    </div>
    <div>
      <button class="btn-add" onclick="addNewStudent()">+ विद्यार्थी थप्नुहोस्</button>
    </div>
    <div>
      <button class="btn-pub" onclick="publishData()">🌐 सुरक्षित Publish गर्नुहोस्</button>
    </div>
  </div>
</div>

<div class="card">
  <div style="width:100%;overflow-x:auto;">
    <table id="tbl"></table>
  </div>
</div>

<script>
// तपाईंको Apps Script को URL
const API_URL = "https://script.google.com/macros/s/AKfycbwb1ilFmQOAzFcnRcTLKvgV2s74SbQlsqWlihIqzFSr7CEDCrjx1mDnCH5LFTaMJN9_kw/exec";
const CLASS_NAME = "9";

let currentData = {
  students: [],
  days: []
};

// सर्भरबाट पुरानो डाटा तान्ने मुख्य फसन
function fetchServerData() {
  let sub = document.getElementById('subject').value;
  let statusBox = document.getElementById('loadingStatus');
  statusBox.style.display = "block";
  statusBox.textContent = "Google Sheet बाट पुरानो डाटा ल्याउँदैछ...";

  fetch(`${API_URL}?className=${CLASS_NAME}&subject=${sub}`)
    .then(res => res.json())
    .then(data => {
      statusBox.style.display = "none";
      if (data && data.students) {
        currentData = data;
      } else {
        currentData = { students: [], days: [] };
      }
      renderDashboard();
    })
    .catch(err => {
      console.error(err);
      statusBox.textContent = "डाटा लोड गर्दा त्रुटि भयो!";
      setTimeout(() => { statusBox.style.display = "none"; }, 2000);
      renderDashboard();
    });
}

function renderDashboard() {
  let targetSec = document.getElementById('sectionFilter').value;
  let students = currentData.students || [];
  let days = currentData.days || [];

  // १. सेक्सन मिलाउने (Case Insensitive Matching)
  let filteredStudents = students.filter(s => {
    if (!s.sec) return true; // यदि सेक्सन नखुलेको भए सबैमा देखाउने
    return s.sec.toString().trim().toLowerCase() === targetSec.toString().trim().toLowerCase();
  });

  // २. नेपाली/अङ्ग्रेजी नाम अनुसार मिलाउने
  filteredStudents.sort((a, b) => a.name.localeCompare(b.name, 'ne'));

  let h = '<thead><tr><th rowspan="2">विद्यार्थीको नाम</th>';
  days.forEach(d => {
    h += `<th colspan="3" style="padding:2px;font-size:10px;">${d}</th>`;
  });
  h += '</tr><tr>';
  days.forEach(() => {
    h += `<th class="sub-th">H</th><th class="sub-th">C</th><th class="sub-th">D</th>`;
  });
  h += '</tr></thead><tbody>';

  if (students.length === 0) {
    h += `<tr><td colspan="50" style="padding:15px; color:#d97706; font-weight:bold;">यो विषय (Subject) मा अझै पुरानो डाटा सेभ भएको छैन।</td></tr>`;
  } else if (filteredStudents.length === 0) {
    h += `<tr><td colspan="50" style="padding:15px; color:#dc2626; font-weight:bold;">${targetSec} सेक्सनमा कुनै विद्यार्थी भेटिएन। (माथिबाट सेक्सन फेरेर हेर्नुहोस्)</td></tr>`;
  } else {
    filteredStudents.forEach((student, idx) => {
      let stId = student.id || idx;
      h += `<tr>`;
      h += `<td class="student-name-td">${student.name}</td>`;
      
      let studentMarks = student.m || {};

      days.forEach(d => {
        let dayData = studentMarks[d] || { hw: 0, cw: 0, dis: 0 };
        
        h += `<td class="cell ${getClass(dayData.hw)}" onclick="toggleMark('${stId}', '${d}', 'hw')">${getSymbol(dayData.hw)}</td>`;
        h += `<td class="cell ${getClass(dayData.cw)}" onclick="toggleMark('${stId}', '${d}', 'cw')">${getSymbol(dayData.cw)}</td>`;
        h += `<td class="cell ${getClass(dayData.dis)}" onclick="toggleMark('${stId}', '${d}', 'dis')">${getSymbol(dayData.dis)}</td>`;
      });
      h += `</tr>`;
    });
  }

  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
}

function getSymbol(val) {
  if (val === 1) return '✓';
  if (val === -1) return '✕';
  return '—';
}

function getClass(val) {
  if (val === 1) return 'green';
  if (val === -1) return 'red';
  return '';
}

function toggleMark(studentId, dateStr, type) {
  let st = currentData.students.find((s, idx) => (s.id == studentId || idx == studentId));
  if (!st) return;
  if (!st.m) st.m = {};
  if (!st.m[dateStr]) st.m[dateStr] = { hw: 0, cw: 0, dis: 0 };

  let currentVal = st.m[dateStr][type] || 0;
  if (currentVal === 0) st.m[dateStr][type] = 1;
  else if (currentVal === 1) st.m[dateStr][type] = -1;
  else st.m[dateStr][type] = 0;

  renderDashboard();
}

function addNewDay() {
  let dateVal = document.getElementById('newDateInput').value;
  if (!dateVal) {
    alert("कृपया मिति छान्नुहोस्!");
    return;
  }
  if (!currentData.days.includes(dateVal)) {
    currentData.days.push(dateVal);
    renderDashboard();
  } else {
    alert("यो मिति पहिले नै छ।");
  }
}

function addNewStudent() {
  let name = document.getElementById('newStudentName').value.trim();
  let sec = document.getElementById('newStudentSec').value;

  if (!name) {
    alert("विद्यार्थीको नाम लेख्नुहोस्!");
    return;
  }

  let newId = Date.now();
  currentData.students.push({
    id: newId,
    name: name,
    sec: sec,
    m: {}
  });

  document.getElementById('newStudentName').value = "";
  renderDashboard();
}

function publishData() {
  let sub = document.getElementById('subject').value;
  let statusBox = document.getElementById('loadingStatus');
  statusBox.style.display = "block";
  statusBox.textContent = "Google Sheet मा सुरक्षित सेभ हुँदैछ...";

  let payload = {
    className: CLASS_NAME,
    subject: sub,
    data: currentData
  };

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    statusBox.style.display = "none";
    alert("डाटा सफलतापूर्वक सेभ भयो!");
  })
  .catch(err => {
    console.error(err);
    statusBox.style.display = "none";
    alert("सेभ हुन सकेन।");
  });
}

window.onload = function() {
  let today = new Date().toISOString().split('T')[0];
  document.getElementById('newDateInput').value = today;
  fetchServerData();
};
</script>

</body>
</html>
